name: Feature request
description: Something clips should do and do not.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "What are you trying to post, and what gets in the way today?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: What you would like, description: "How it would work in the app or the CLI. Check docs/TODO.md first; it may already be planned." }
  - type: checkboxes
    id: rules
    attributes:
      label: Fits the project's rules
      options:
        - label: It keeps video on the machine (only transcript text may go to the picker).
        - label: It does not need Python, Node, Ollama or a bundled model at runtime.
