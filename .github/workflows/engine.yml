name: engine

on:
  push:
    paths: ["engine/**", "scripts/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "scripts/**", ".github/workflows/engine.yml"]

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build tools
        run: brew install nasm pkg-config meson ninja
      - name: Cache minimal FFmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/8.1.3-macos-arm64
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/ffmpeg/build-mac.sh', 'scripts/ffmpeg/VERSIONS') }}
      - name: Build minimal LGPL FFmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        working-directory: .
        run: ./scripts/ffmpeg/build-mac.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build (release)
        run: cargo build --release --all
      - name: Test
        run: cargo test --all
      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings
      - name: Size report
        working-directory: .
        run: ./scripts/size-check.sh engine/target/release >> "$GITHUB_STEP_SUMMARY"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/Cargo.toml
          command: check advisories bans licenses sources
