name: engine

on:
  push:
    paths: ["engine/**", "scripts/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "scripts/**", ".github/workflows/engine.yml"]

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build tools
        run: brew install nasm pkg-config meson ninja
      - name: Cache minimal FFmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/8.1.3-macos-arm64
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/ffmpeg/build-mac.sh', 'scripts/ffmpeg/VERSIONS') }}
      - name: Build minimal LGPL FFmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        working-directory: .
        run: ./scripts/ffmpeg/build-mac.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build (release)
        run: cargo build --release --all
      - name: Generate test fixtures
        working-directory: .
        # Dev-only Homebrew ffmpeg writes synthetic media; it is never linked or shipped.
        run: brew install ffmpeg && ./engine/fixtures/generate.sh
      - name: Test
        run: cargo test --all
      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings
      - name: Size report
        working-directory: .
        run: ./scripts/size-check.sh engine/target/release >> "$GITHUB_STEP_SUMMARY"
      - name: Share fixtures with the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: engine/fixtures/media
          retention-days: 3

  windows:
    # Build, test and lint on Windows against our minimal LGPL FFmpeg (scripts/ffmpeg/VERSIONS-windows).
    runs-on: windows-latest
    needs: macos            # the fixtures need macOS `say`; both OSes test the same bytes
    defaults:
      run:
        shell: bash
        working-directory: engine
    env:
      FFMPEG_DIR: ${{ github.workspace }}\vendor\ffmpeg\8.1.3-windows-x64
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Minimal LGPL FFmpeg (ours, pinned, sha256-checked)
        working-directory: .
        run: ./scripts/ffmpeg/fetch-windows.sh
      - name: FFmpeg DLLs on PATH for tests
        working-directory: .
        run: echo "$(cygpath -w "$PWD/vendor/ffmpeg/8.1.3-windows-x64/bin")" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: engine/fixtures/media
      - name: Build (release)
        run: cargo build --release --all
      - name: Test (Media Foundation software encoder; the runner has no GPU)
        env:
          CHOCO_ENCODERS: h264_mf
        run: cargo test --all
      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/Cargo.toml
          command: check advisories bans licenses sources
