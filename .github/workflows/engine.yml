name: engine

on:
  push:
    paths: ["engine/**", "scripts/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "scripts/**", ".github/workflows/engine.yml"]

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned general LGPL build for CI linking and tests. M6 replaces it with our minimal Windows build.
  WIN_FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-17-20-51/ffmpeg-n8.1.3-18-g46d899d7a0-win64-lgpl-shared-8.1.zip
  WIN_FFMPEG_SHA256: a5b362ae7ddacb2d97974cb8dc1fa84339a77d996c274cf3fad32605f40288be

jobs:
  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build tools
        run: brew install nasm pkg-config
      - name: Cache minimal FFmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg/8.1.3-macos-arm64
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/ffmpeg/build-mac.sh', 'scripts/ffmpeg/VERSIONS') }}
      - name: Build minimal LGPL FFmpeg
        if: steps.ffcache.outputs.cache-hit != 'true'
        working-directory: .
        run: ./scripts/ffmpeg/build-mac.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Build (release)
        run: cargo build --release --all
      - name: Test
        run: cargo test --all
      - name: Clippy
        run: cargo clippy --all --all-targets -- -D warnings
      - name: Size report
        working-directory: .
        run: ./scripts/size-check.sh engine/target/release >> "$GITHUB_STEP_SUMMARY"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Fetch pinned LGPL FFmpeg
        working-directory: .
        run: |
          curl -fsSL -o ff.zip "$WIN_FFMPEG_URL"
          echo "$WIN_FFMPEG_SHA256  ff.zip" | sha256sum -c -
          unzip -q ff.zip -d vendor/ffmpeg && rm ff.zip
          dir="$(cd vendor/ffmpeg/ffmpeg-*-win64-lgpl-shared-8.1 && pwd -W)"
          grep -q "GNU LESSER GENERAL PUBLIC LICENSE" "vendor/ffmpeg/$(basename "$dir")/LICENSE.txt"
          echo "FFMPEG_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      # Metal and Apple speech do not exist on Windows; whisper runs on CPU until M6 adds Vulkan.
      - name: Build (release)
        run: cargo build --release --all --no-default-features --features choco-engine/whisper
      - name: Test
        run: cargo test --all --no-default-features --features choco-engine/whisper
      - name: Clippy
        run: cargo clippy --all --all-targets --no-default-features --features choco-engine/whisper -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: engine/Cargo.toml
          command: check advisories bans licenses sources
