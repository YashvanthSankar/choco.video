# Point ffmpeg-sys-next at the vendored minimal LGPL build (scripts/ffmpeg/build-mac.sh).
[env]
PKG_CONFIG_PATH = { value = "../vendor/ffmpeg/8.1.3-macos-arm64/lib/pkgconfig", relative = true }
CHOCO_FFMPEG_LIB_DIR = { value = "../vendor/ffmpeg/8.1.3-macos-arm64/lib", relative = true }

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-mmacosx-version-min=14.0"]

# One static C runtime on Windows: no VC++ redistributable for users (docs/TECH.md §19). The cmake
# crate builds whisper.cpp with the matching /MT; scripts/check-imports.sh proves nothing links
# vcruntime140.dll.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
