<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5a2e"/><stop offset="1" stop-color="#5b3018"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ef"/><stop offset="1" stop-color="#f1e2d0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a1408" flood-opacity=".45"/></filter>
  </defs>
  <!-- macOS icon grid: 824 px rounded square centred in 1024 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="412" rx="185" fill="#ffffff" opacity=".06"/>
  <!-- wide source frame behind -->
  <rect x="210" y="372" width="604" height="340" rx="40" fill="#3b1e0e" opacity=".55"/>
  <!-- the vertical clip -->
  <g filter="url(#sh)">
    <rect x="372" y="236" width="280" height="498" rx="44" fill="url(#card)"/>
  </g>
  <circle cx="512" cy="440" r="58" fill="#c98a5c"/>
  <path d="M412 640c0-62 45-104 100-104s100 42 100 104v50H412z" fill="#8a4b22"/>
  <!-- caption bar with the active word -->
  <rect x="404" y="600" width="72" height="30" rx="8" fill="#ffd84a"/>
  <rect x="486" y="600" width="134" height="30" rx="8" fill="#ffffff"/>
  <rect x="372" y="236" width="280" height="498" rx="44" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="4"/>
